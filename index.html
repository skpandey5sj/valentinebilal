<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For My Love ❤️</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-pink-50 flex items-center justify-center min-h-screen">

  <div class="max-w-xl w-full bg-white shadow-2xl rounded-2xl p-6 text-center">
    <h1 class="text-3xl font-bold text-pink-600 mb-4">Happy Valentine's Day ❤️</h1>

    <p class="text-gray-700 mb-6">Mere dil ki sabse pyaari insaan ke liye chhota sa surprise 💖</p>

    <div id="questionBox">
      <p id="question" class="text-xl font-semibold mb-4">Kya tum mujhse pyaar karti ho? 😍</p>

      <div class="flex justify-center gap-4">
        <button onclick="yesAnswer()" class="bg-pink-500 text-white px-4 py-2 rounded-lg hover:bg-pink-600">Haan 💘</button>
        <button onclick="noAnswer()" class="bg-gray-300 px-4 py-2 rounded-lg hover:bg-gray-400">Nahi 😒</button>
      </div>
    </div>

    <div id="result" class="hidden mt-6">
      <p id="message" class="text-2xl font-bold text-pink-600"></p>

      <div class="mt-4">
        <p class="text-gray-700">Tum meri zindagi ka sabse khubsurat hissa ho. Mai hamesha tumhare saath rehna chahta hoon ❤️</p>
      </div>
    </div>

    <div class="mt-6 text-sm text-gray-500">Made with pure love by your pagal 💌</div>
  </div>

<script>
function yesAnswer() {
  document.getElementById('questionBox').classList.add('hidden');
  document.getElementById('result').classList.remove('hidden');
  document.getElementById('message').innerText = "Mujhe pata tha tum bhi mujhse utna hi pyaar karti ho! 😘";
}

function noAnswer() {
  document.getElementById('question').innerText = "Soch lo ek baar phir se 😢";
}
</script>

</body>
</html>
